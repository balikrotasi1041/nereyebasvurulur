name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'ci/cloudflare-deploy-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bafb073b0ff52a7b1f5a4626301ec82
        run: npx --yes wrangler@latest deploy

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          base="https://nereyebasvurulur.com"
          verified=0
          for attempt in $(seq 1 20); do
            curl --fail --show-error --silent --location "${base}/?deploy-check=${GITHUB_SHA}" -o /tmp/home.html
            if grep -Fq 'name="google-site-verification" content="5Vmhgh-JkZi7cm_gjUHEwjNymv-Sds3VmXmLpmDp3KU"' /tmp/home.html \
              && grep -Fq 'name="yandex-verification" content="3fa0665bc8ba3bb6"' /tmp/home.html; then
              verified=1
              break
            fi
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::Search-engine verification tags are not visible on the live homepage."
            exit 1
          fi
          curl --fail --show-error --silent "${base}/health" | grep -Fq '"status":"ok"'
          curl --fail --show-error --silent "${base}/robots.txt" | grep -Fq 'Sitemap: https://nereyebasvurulur.com/sitemap.xml'
          curl --fail --show-error --silent "${base}/sitemap.xml" | grep -Fq '<urlset'
          test "$(curl --fail --show-error --silent "${base}/b1493a8a691bb36804ec62b677f59d5b.txt")" = 'b1493a8a691bb36804ec62b677f59d5b'
          echo "Live homepage, Google/Yandex verification tags, health, robots, sitemap and IndexNow key verified."
