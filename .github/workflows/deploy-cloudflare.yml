name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production quality gates
        run: |
          pnpm run validate
          pnpm run audit:sources

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bafb073b0ff52a7b1f5a4626301ec82
        run: pnpm exec wrangler deploy --keep-vars --message "main ${GITHUB_SHA}"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          base="https://nereyebasvurulur.com"
          curlr() { curl --retry 4 --retry-delay 1 --retry-all-errors "$@"; }
          verified=0
          for attempt in $(seq 1 30); do
            if curlr --fail --show-error --silent --location "${base}/?deploy-check=${GITHUB_SHA}" -o /tmp/home.html \
              && curlr --fail --show-error --silent "${base}/health?deploy-check=${GITHUB_SHA}" -o /tmp/health.json; then
              if grep -Fq 'name="google-site-verification" content="5Vmhgh-JkZi7cm_gjUHEwjNymv-Sds3VmXmLpmDp3KU"' /tmp/home.html \
                && grep -Fq 'name="yandex-verification" content="3fa0665bc8ba3bb6"' /tmp/home.html \
                && grep -Fq '"release":"v11-search-security-growth-2026-09-01"' /tmp/health.json \
                && grep -Fq '"preferenceLayer":true' /tmp/health.json \
                && grep -Fq '"quickAnswerLayer":true' /tmp/health.json \
                && grep -Fq '"deadlineRadar":true' /tmp/health.json \
                && grep -Fq '"smartSearch":true' /tmp/health.json \
                && grep -Fq '"noNewPreferenceUrls":true' /tmp/health.json \
                && grep -Fq '"scannerProbeBlocking":true' /tmp/health.json \
                && grep -Fq '"blockedIpCount":8' /tmp/health.json \
                && grep -Fq '"adaptiveRestrictionCount":2' /tmp/health.json \
                && grep -Fq '"verifiedBotBypass":true' /tmp/health.json \
                && grep -Fq '"militaryAnnouncementFeed":true' /tmp/health.json; then
                verified=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::The expected v11 search/security release did not become visible on the live domain."
            exit 1
          fi

          grep -Fq 'Yaklaşan resmî tarihler' /tmp/home.html
          grep -Fq 'Genel başvuru ve kayıt tarihleri' /tmp/home.html
          grep -Fq 'ASAL / Askeralma yaklaşan tarihleri' /tmp/home.html
          grep -Fq 'Askeralma ve sevk takvimleri' /tmp/home.html

          curlr --fail --show-error --silent "${base}/konu/bedelli-askerlik-nereye-basvurulur/?deploy-check=${GITHUB_SHA}" -o /tmp/route.html
          grep -Fq '30 saniyede cevap' /tmp/route.html
          grep -Fq 'Gitmeden / başvurmadan önce' /tmp/route.html
          grep -Fq 'Şimdi ne yapmalısınız?' /tmp/route.html
          grep -Fq 'Güncellik kaydı:' /tmp/route.html
          grep -Fq 'Bugün yapılabilir mi?' /tmp/route.html
          grep -Fq 'İnsanlar bunu şöyle de arıyor' /tmp/route.html
          grep -Fq 'FAQPage' /tmp/route.html
          grep -Fq 'BreadcrumbList' /tmp/route.html
          grep -Fq 'Bu işlemle ilgili askerlik takvimi' /tmp/route.html

          curlr --fail --show-error --silent "${base}/ara?q=Ceyhan%20askerlik%20%C5%9Fubesi%20telefon%20numaras%C4%B1" -o /tmp/search.html
          grep -Fq 'Ceyhan askerlik şubesi' /tmp/search.html
          curlr --fail --show-error --silent --dump-header /tmp/searchheaders --output /dev/null "${base}/ara?q=Ceyhan%20askerlik%20%C5%9Fubesi%20konumu%20navigasyon"
          tr -d '\r' < /tmp/searchheaders | grep -Eiq '^cache-control: private, no-store$'
          tr -d '\r' < /tmp/searchheaders | grep -Eiq '^x-robots-tag: noindex, follow, noarchive$'
          tr -d '\r' < /tmp/searchheaders | grep -Eiq '^x-smart-search: v1$'

          curlr --fail --show-error --silent "${base}/robots.txt" -o /tmp/robots.txt
          grep -Fq 'Disallow: /admin/' /tmp/robots.txt
          grep -Fq 'Disallow: /health' /tmp/robots.txt
          grep -Fq 'Sitemap: https://nereyebasvurulur.com/sitemap.xml' /tmp/robots.txt
          curlr --fail --show-error --silent "${base}/sitemap.xml" -o /tmp/sitemap.xml
          grep -Fq '<urlset' /tmp/sitemap.xml
          grep -Fq '<loc>https://nereyebasvurulur.com/duyurular/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://nereyebasvurulur.com/askerlik-subeleri/duyurular/</loc>' /tmp/sitemap.xml

          curlr --fail --show-error --silent "${base}/askerlik-subeleri/duyurular/?deploy-check=${GITHUB_SHA}" -o /tmp/asal.html
          grep -Fq 'Askeralma takvimi ve sevk duyuruları' /tmp/asal.html
          curlr --fail --show-error --silent "${base}/duyurular/?deploy-check=${GITHUB_SHA}" -o /tmp/general.html
          grep -Fq 'Resmî Duyurular' /tmp/general.html

          curlr --fail --show-error --silent --head "${base}/" -o /tmp/headers.txt
          grep -Eiq '^strict-transport-security: max-age=31536000; includeSubDomains' /tmp/headers.txt
          grep -Eiq '^content-security-policy:' /tmp/headers.txt
          grep -Eiq '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -Eiq '^x-security-layer: v11-search-security-growth-2026-09-01' /tmp/headers.txt

          test "$(curlr --silent --output /dev/null --write-out '%{http_code}' "${base}/admin/dashboard/")" = '401'
          test "$(curlr --silent --output /tmp/probe.txt --write-out '%{http_code}' "${base}/wp-login.php")" = '404'
          test "$(curlr --silent --output /tmp/randomphp.txt --write-out '%{http_code}' "${base}/UuAFIYGYKdefault.php")" = '404'
          test "$(curlr --silent --output /tmp/serverstatus.txt --write-out '%{http_code}' "${base}/server-status")" = '404'
          test "$(curlr --silent --output /tmp/nestedwp.txt --write-out '%{http_code}' "${base}/shop/wp-includes/wlwmanifest.xml")" = '404'
          test "$(curlr --silent --output /tmp/gitprobe.txt --write-out '%{http_code}' "${base}/backup/.git/HEAD")" = '404'

          curlr --fail --show-error --silent --dump-header /tmp/healthheaders --output /dev/null "${base}/health"
          tr -d '\r' < /tmp/healthheaders | grep -Eiq '^cache-control: no-store, max-age=0$'
          tr -d '\r' < /tmp/healthheaders | grep -Eiq '^x-robots-tag: noindex, nofollow, noarchive$'

          curlr --fail --show-error --silent --dump-header /tmp/cache1 --output /dev/null "${base}/"
          sleep 1
          curlr --fail --show-error --silent --dump-header /tmp/cache2 --output /dev/null "${base}/"
          tr -d '\r' < /tmp/cache2 | grep -Eiq '^x-edge-cache: HIT$'

          test "$(curlr --fail --show-error --silent "${base}/b1493a8a691bb36804ec62b677f59d5b.txt")" = 'b1493a8a691bb36804ec62b677f59d5b'
          echo "V11 search aliases, live status, schema, internal links, adaptive security, cache, feeds, sitemap and IndexNow key verified."

      - name: Notify IndexNow
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          base = "https://nereyebasvurulur.com"
          key = "b1493a8a691bb36804ec62b677f59d5b"
          sitemap_url = f"{base}/sitemap.xml"
          key_location = f"{base}/{key}.txt"
          user_agent = "nereyebasvurulur-deploy/1.0 (+https://nereyebasvurulur.com)"

          sitemap_request = urllib.request.Request(sitemap_url, headers={"User-Agent": user_agent})
          with urllib.request.urlopen(sitemap_request, timeout=20) as response:
              xml = response.read()

          root = ET.fromstring(xml)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall("sm:url/sm:loc", ns) if node.text and node.text.strip()]
          if not urls:
              raise SystemExit("No URLs found in sitemap; IndexNow notification aborted.")

          payload = json.dumps({
              "host": "nereyebasvurulur.com",
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": user_agent},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              status = exc.code
              if status not in (200, 202):
                  raise

          if status not in (200, 202):
              raise SystemExit(f"IndexNow returned unexpected HTTP {status}")
          print(f"IndexNow accepted {len(urls)} URLs with HTTP {status}.")
          PY
