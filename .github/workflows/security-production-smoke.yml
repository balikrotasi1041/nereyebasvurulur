name: Security production smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for hardened release
        shell: bash
        run: |
          set -euo pipefail
          base="https://nereyebasvurulur.com"
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --show-error --silent "${base}/health" | grep -Fq '"release":"v6-security-hardening-2026-08-24"'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify scanner probes are blocked
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --output /tmp/probe.txt --write-out '%{http_code}' https://nereyebasvurulur.com/wp-login.php)
          test "$code" = "404"
          grep -Fq 'Not Found' /tmp/probe.txt

      - name: Verify versioned edge cache
        shell: bash
        run: |
          set -euo pipefail
          base="https://nereyebasvurulur.com/"
          curl --fail --show-error --silent --dump-header /tmp/h1 --output /dev/null "$base"
          sleep 1
          curl --fail --show-error --silent --dump-header /tmp/h2 --output /dev/null "$base"
          tr -d '\r' < /tmp/h2 | grep -Eiq '^x-edge-cache: HIT$'

      - name: Verify search remains private no-store
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --dump-header /tmp/search --output /dev/null 'https://nereyebasvurulur.com/ara?q=guvenlik-test'
          tr -d '\r' < /tmp/search | grep -Eiq '^cache-control: private, no-store$'
